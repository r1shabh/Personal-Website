<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Climbing Route Notebook — Rishabh Anand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:  #f5f0e8;
      --ink:    #1c1a17;
      --muted:  #7a7167;
      --accent: #b5432a;
      --rule:   #d6cfc2;
      --mono:   'DM Mono', monospace;
      --serif:  'Cormorant Garamond', Georgia, serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 18px;
      line-height: 1.75;
      min-height: 100vh;
    }

    /* ── NAV ── */
    .site-nav {
      background: var(--ink);
      padding: 18px 36px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .site-nav a {
      font-family: var(--mono);
      font-size: .72rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(245,240,232,.5);
      text-decoration: none;
      transition: color .2s;
    }
    .site-nav a:hover { color: var(--cream); }
    .site-nav .sep { font-family: var(--mono); font-size: .72rem; color: rgba(245,240,232,.2); }
    .site-nav .current { color: var(--accent); cursor: default; }

    /* ── HERO ── */
    .hero {
      background: var(--ink);
      padding: 56px 36px 64px;
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1px;
      background: rgba(245,240,232,.12);
    }
    .hero-eyebrow {
      font-family: var(--mono);
      font-size: .72rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
    }
    .hero-title {
      font-family: var(--serif);
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 300;
      color: var(--cream);
      line-height: 1.15;
      max-width: 640px;
    }
    .hero-title em { font-style: italic; font-weight: 300; }
    .hero-description {
      margin-top: 24px;
      max-width: 580px;
      font-size: 1.05rem;
      color: rgba(245,240,232,.65);
      line-height: 1.8;
    }
    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 28px;
    }
    .tag {
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(245,240,232,.5);
      border: 1px solid rgba(245,240,232,.15);
      padding: 4px 10px;
      border-radius: 2px;
    }

    /* ── LAYOUT ── */
    .outer {
      max-width: 860px;
      margin: 0 auto;
      padding: 64px 28px 100px;
    }
    .section-label {
      font-family: var(--mono);
      font-size: .72rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      padding-bottom: 10px;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 40px;
    }

    /* ── SCREENSHOT GRID ── */
    .screenshots {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 48px 36px;
    }
    .screenshot-frame {
      width: 100%;
      aspect-ratio: 9 / 16;
      background: #2a2620;
      border: 1px solid var(--rule);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .screenshot-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .screenshot-frame .placeholder-label {
      position: absolute;
      font-family: var(--mono);
      font-size: .7rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(245,240,232,.2);
    }
    .screenshot-number {
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .14em;
      color: var(--accent);
      margin-top: 18px;
      margin-bottom: 6px;
    }
    .screenshot-caption {
      font-family: var(--serif);
      font-size: 1rem;
      color: #4a4640;
      line-height: 1.7;
    }

    /* ── FOOTER ── */
    footer {
      margin-top: 80px;
      padding-top: 24px;
      border-top: 1px solid var(--rule);
      text-align: center;
      font-family: var(--mono);
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .hero  { animation: fadeUp .6s ease both; }
    .outer { animation: fadeUp .6s .15s ease both; }

    /* ── RESPONSIVE ── */
    @media (max-width: 520px) {
      .screenshots { grid-template-columns: 1fr; }
      .site-nav { padding: 16px 20px; }
      .hero { padding: 40px 20px 48px; }
    }
  </style>
</head>
<body>

  <nav class="site-nav">
    <a href="index.html">Rishabh Anand</a>
    <span class="sep">/</span>
    <span class="current" id="nav-title">Climbing Route Notebook</span>
  </nav>

  <header class="hero">
    <p class="hero-eyebrow">Project</p>
    <h1 class="hero-title" id="hero-title">Loading<em>…</em></h1>
    <p class="hero-description" id="hero-description"></p>
    <div class="hero-tags" id="hero-tags"></div>
  </header>

  <main class="outer">
    <p class="section-label">Screenshots</p>
    <div class="screenshots" id="screenshots"></div>
    <footer>
      <a href="index.html">&larr; Back to Rishabh Anand</a>
      &nbsp;&mdash;&nbsp;
      &copy; <span id="year"></span>
    </footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // ── Parse climbing.md into structured data ──
    // Expected format:
    //   # Title
    //   ## Description   → paragraph(s) of text
    //   ## Tags          → comma-separated list
    //   ## Screenshots   → ### filename.jpg  then description paragraph(s)

    function parseClimbingMd(md) {
      const lines = md.split('\n');
      const result = { title: '', description: '', tags: [], screenshots: [] };

      let section = null;
      let buffer = [];

      function flushBuffer() {
        return buffer.join('\n').trim();
      }

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        if (line.startsWith('# ') && !result.title) {
          result.title = line.slice(2).trim();
          continue;
        }

        if (line.startsWith('## ')) {
          // Save previous buffer
          if (section === 'description') result.description = flushBuffer();
          if (section === 'tags') {
            result.tags = flushBuffer().split(',').map(t => t.trim()).filter(Boolean);
          }
          buffer = [];
          section = line.slice(3).trim().toLowerCase();
          continue;
        }

        if (section === 'screenshots' && line.startsWith('### ')) {
          // Save previous screenshot description if any
          if (result.screenshots.length > 0) {
            result.screenshots[result.screenshots.length - 1].caption = flushBuffer();
          }
          buffer = [];
          result.screenshots.push({ filename: line.slice(4).trim(), caption: '' });
          continue;
        }

        buffer.push(line);
      }

      // Flush final buffer
      if (section === 'description') result.description = flushBuffer();
      if (section === 'tags') {
        result.tags = flushBuffer().split(',').map(t => t.trim()).filter(Boolean);
      }
      if (section === 'screenshots' && result.screenshots.length > 0) {
        result.screenshots[result.screenshots.length - 1].caption = flushBuffer();
      }

      return result;
    }

    function renderPage(data) {
      // Hero
      document.title = data.title + ' — Rishabh Anand';
      document.getElementById('nav-title').textContent = data.title;
      document.getElementById('hero-title').innerHTML =
        data.title.replace(/(\S+)\s*$/, '<em>$1</em>');
      document.getElementById('hero-description').textContent = data.description;

      // Tags
      const tagsEl = document.getElementById('hero-tags');
      data.tags.forEach(tag => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = tag;
        tagsEl.appendChild(span);
      });

      // Screenshots
      const grid = document.getElementById('screenshots');
      data.screenshots.forEach((s, i) => {
        const num = String(i + 1).padStart(2, '0');
        const item = document.createElement('div');
        item.className = 'screenshot-item';
        item.innerHTML = `
          <div class="screenshot-frame">
            <span class="placeholder-label">${s.filename}</span>
            <img src="climbing/${s.filename}" alt="Screenshot ${num}"
                 onerror="this.style.display='none'" />
          </div>
          <p class="screenshot-number">${num}</p>
          <p class="screenshot-caption">${s.caption || 'Description coming soon.'}</p>
        `;
        grid.appendChild(item);
      });
    }

    fetch('climbing.md?v=' + Date.now())
      .then(r => {
        if (!r.ok) throw new Error('Could not load climbing.md');
        return r.text();
      })
      .then(md => renderPage(parseClimbingMd(md)))
      .catch(err => {
        document.getElementById('hero-title').innerHTML = 'Climbing Route <em>Notebook</em>';
        document.getElementById('screenshots').innerHTML =
          `<p style="color:var(--accent);font-family:var(--mono);font-size:.85rem;">
            ⚠ Could not load <strong>climbing.md</strong>.<br>
            Make sure it lives next to <strong>climbing.html</strong> and you are serving over HTTP.
          </p>`;
      });
  </script>

</body>
</html>
